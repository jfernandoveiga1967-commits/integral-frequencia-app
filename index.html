<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Programa do Integral - Colégio Crescer</title>

    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="msapplication-TileColor" content="#4f46e5" />

    <!-- iOS / Apple PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Integral Frequência" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512.png?v=2" />

    <!-- Android & Standard Mobile App Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Integral Frequência" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />
    <link rel="alternate icon" type="image/png" href="/pwa-192.png?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register PWA Service Worker safely -->
    <script>
      // Global capture of PWA beforeinstallprompt event
      window.deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });

      if ('serviceWorker' in navigator) {
        const registerSW = () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('PWA ServiceWorker registrado com sucesso:', reg.scope);
            })
            .catch((err) => {
              console.error('Falha ao registrar ServiceWorker:', err);
            });
        };

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW);
        }
      }
    </script>
  </body>
</html>
