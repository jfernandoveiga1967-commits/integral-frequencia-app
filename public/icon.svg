<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Base Canvas Background -->
  <rect width="512" height="512" rx="112" fill="#0F172A"/>

  <!-- Subtle Outer Orbital Guide Ring -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#1E293B" stroke-width="20"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#3B82F6" stroke-width="6" stroke-dasharray="16 12" opacity="0.6"/>

  <!-- 4 Flat Activity Badges in Orbits (Natação, Futebol, Ginástica/Balé, Judô) -->
  
  <!-- Top-Left: Natação (Swimming Wave) -->
  <g transform="translate(110, 110)">
    <circle cx="0" cy="0" r="36" fill="#0284C7"/>
    <path d="M-18 -3 C-9 -13 0 7 9 -3 C14 -8 18 -3 18 -3" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M-18 8 C-9 -2 0 18 9 8 C14 3 18 8 18 8" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Top-Right: Futebol (Soccer Ball) -->
  <g transform="translate(402, 110)">
    <circle cx="0" cy="0" r="36" fill="#16A34A"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <polygon points="0,-9 8.5,-3 5.3,7 -5.3,7 -8.5,-3" fill="#FFFFFF"/>
  </g>

  <!-- Bottom-Left: Balé / Ginástica (Ribbon Loop) -->
  <g transform="translate(110, 402)">
    <circle cx="0" cy="0" r="36" fill="#EC4899"/>
    <path d="M-12 12 C-18 -10 0 -18 0 -5 C0 8 18 -10 12 12" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Bottom-Right: Judô / Artes Marciais (Belt Knot) -->
  <g transform="translate(402, 402)">
    <circle cx="0" cy="0" r="36" fill="#EAB308"/>
    <path d="M-15 -6 L15 -6 M-15 4 L15 4" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M-5 -6 L-10 13 M5 -6 L10 13" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Central Focal Point: Stylized Attendance Clipboard (Prancheta de Chamada) -->
  <g transform="translate(256, 256)">
    <!-- Clipboard Drop Shadow -->
    <rect x="-102" y="-120" width="204" height="260" rx="24" fill="#020617" opacity="0.45"/>
    
    <!-- Clipboard Main Body -->
    <rect x="-96" y="-124" width="192" height="252" rx="22" fill="#2563EB"/>
    
    <!-- Paper Sheet -->
    <rect x="-78" y="-94" width="156" height="208" rx="12" fill="#FFFFFF"/>
    
    <!-- Metallic Clip Top -->
    <path d="M-42 -124 L-42 -138 C-42 -146 -32 -152 -22 -152 L22 -152 C32 -152 42 -146 42 -138 L42 -124 Z" fill="#64748B"/>
    <rect x="-32" y="-148" width="64" height="24" rx="6" fill="#94A3B8"/>
    <circle cx="0" cy="-136" r="5" fill="#334155"/>

    <!-- Attendance Checklist Rows on Paper -->
    <!-- Row 1 -->
    <rect x="-58" y="-70" width="22" height="22" rx="6" fill="#10B981"/>
    <path d="M-52 -59 L-48 -55 L-41 -63" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-24" y="-63" width="82" height="8" rx="4" fill="#CBD5E1"/>

    <!-- Row 2 -->
    <rect x="-58" y="-35" width="22" height="22" rx="6" fill="#10B981"/>
    <path d="M-52 -24 L-48 -20 L-41 -28" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-24" y="-28" width="68" height="8" rx="4" fill="#CBD5E1"/>

    <!-- Row 3 -->
    <rect x="-58" y="0" width="22" height="22" rx="6" fill="#10B981"/>
    <path d="M-52 11 L-48 15 L-41 7" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-24" y="7" width="76" height="8" rx="4" fill="#CBD5E1"/>

    <!-- Prominent Attendance Seal / Badge (Bottom Right Overlay) -->
    <g transform="translate(32, 54)">
      <circle cx="0" cy="0" r="38" fill="#10B981"/>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <!-- Bold White Checkmark -->
      <path d="M-13 1 L-5 9 L14 -10" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
